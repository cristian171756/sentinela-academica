<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinela Acadêmica | Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="ui.css">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar" id="sidebar"></aside>

    <main class="content">

        <header class="top-bar">
            <div>
                <h1 id="tituloChat">Chat da Turma</h1>
                <p id="subtituloChat">Converse com colegas, professores e coordenação.</p>
            </div>
            <div class="avatar-coord"><i class="fa-solid fa-comments"></i></div>
        </header>

        <div class="chat-shell">

            <aside class="chat-sidebar" id="chatSidebar" style="display:none;">
                <div class="chat-sidebar-head">
                    <h3><i class="fa-solid fa-layer-group"></i> Turmas</h3>
                    <p>Selecione uma sala</p>
                </div>
                <div id="listaTurmasChat" class="chat-room-list"></div>
            </aside>

            <section class="chat-main">
                <div class="chat-main-head">
                    <div>
                        <strong>Sala da turma</strong>
                        <span>Fotos, mensagens e presença em tempo real</span>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chatInput" placeholder="Digite uma mensagem..." maxlength="500" autocomplete="off">
                    <button id="chatEnviar" type="button"><i class="fa-solid fa-paper-plane"></i> Enviar</button>
                </div>
            </section>

        </div>

    </main>

</div>

<script src="dados.js"></script>

<script src="ipa.js"></script>
<script src="preferencias.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>

</body>

</html>
